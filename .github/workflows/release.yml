name: Release

# 手动触发，避免在尚未配置签名 Secrets 时因 push tag 产生失败构建。
# 需要仓库 Secrets：
#   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD,
#   SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > keystore/louji-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/louji-release.jks
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF

      - name: Build signed APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "louji-${{ inputs.tag }}.apk"
          sha256sum "louji-${{ inputs.tag }}.apk" > "louji-${{ inputs.tag }}.apk.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "楼记 ${{ inputs.tag }}"
          files: |
            louji-${{ inputs.tag }}.apk
            louji-${{ inputs.tag }}.apk.sha256
          generate_release_notes: false
